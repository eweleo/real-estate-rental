version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:${SQL_SERVER_VERSION:-2022-latest}
    container_name: sqlserver_db
    hostname: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-Nutella12345}
      - MSSQL_PID=${MSSQL_PID:-Express}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - sqlserver_network
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-Nutella12345}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  sqlserver_data:
    driver: local
    name: sqlserver_data

networks:
  sqlserver_network:
    driver: bridge
    name: sqlserver_network